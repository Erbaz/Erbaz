<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12331f" />
      <stop offset="50%" stop-color="#0c2416" />
      <stop offset="100%" stop-color="#081a0f" />
    </linearGradient>
    <!-- <radialGradient id="centerGlow" gradientUnits="userSpaceOnUse" cx="400" cy="100" r="260">
      <stop offset="0%" stop-color="#E9C214" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#E9C214" stop-opacity="0.05" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient> -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE55C" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#DAA520" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.8" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <pattern id="diagPattern" width="25" height="25" patternUnits="userSpaceOnUse" patternTransform="rotate(60)">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#FFD900" stroke-opacity="0.25" stroke-width="1" />
    </pattern>
    <pattern id="diagPattern2" width="25" height="25" patternUnits="userSpaceOnUse" patternTransform="rotate(-60)">
      <line x1="0" y1="0" x2="0" y2="25" stroke="#FFD900" stroke-opacity="0.25" stroke-width="1" />
    </pattern>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur" />
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur" />
      <feFlood flood-color="#FFD700" flood-opacity="0.15" result="color" />
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect width="800" height="200" fill="url(#bgGrad)" rx="14" stroke="#FFD700" stroke-width="1" />
    <rect width="800" height="200" fill="url(#centerGlow)" opacity="0.8" />
    <rect width="800" height="200" fill="url(#diagPattern)" opacity="0.5" />
    <rect width="800" height="200" fill="url(#diagPattern2)" opacity="0.5" />

    <line x1="8" y1="8" x2="32" y2="8" stroke="#FFD700" stroke-width="2" />
    <line x1="8" y1="8" x2="8" y2="32" stroke="#FFD700" stroke-width="2" />

    <line x1="792" y1="8" x2="768" y2="8" stroke="#FFD700" stroke-width="2" />
    <line x1="792" y1="8" x2="792" y2="32" stroke="#FFD700" stroke-width="2" />

    <line x1="8" y1="192" x2="32" y2="192" stroke="#FFD700" stroke-width="2" />
    <line x1="8" y1="192" x2="8" y2="168" stroke="#FFD700" stroke-width="2" />

    <line x1="792" y1="192" x2="768" y2="192" stroke="#FFD700" stroke-width="2" />
    <line x1="792" y1="192" x2="792" y2="168" stroke="#FFD700" stroke-width="2" />

    <g>
      <text x="400" y="102" text-anchor="middle" font-size="52" font-weight="900" letter-spacing="1"
        fill="url(#titleGrad)" filter="url(#textGlow)">Erbaz Kamran</text>
      <rect x="200" y="110" width="400" height="1.4" fill="url(#barGrad)" />
      <text x="400" y="142" text-anchor="middle" font-size="20" font-weight="700" letter-spacing="0.5" fill="#FFE078"
        fill-opacity="0.8" font-family="Segoe UI,Helvetica,Arial,sans-serif">Senior Software Engineer | Agentic-AI
        Engineer | Team Lead</text>
    </g>
  </g>
</svg>